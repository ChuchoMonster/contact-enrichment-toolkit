# fly.toml app configuration file generated for coldstart-leads on 2026-04-10T10:55:06-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coldstart-leads'
primary_region = 'ord'

[build]

[env]
  DB_PATH = '/data/blitz_web.db'
  GWS_CLI_PATH = '/usr/bin/gws'

[[mounts]]
  source = 'blitz_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
